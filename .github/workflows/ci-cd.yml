name: Frontend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
  VITE_ANALYTICS_DISABLED: "true"

jobs:
  verify:
    name: Qualité, build et navigateurs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Installer Chromium et Firefox
        run: npx playwright install --with-deps chromium firefox

      - name: Vérifier lint, tests unitaires et build
        run: npm run ci:quality

      - name: Exécuter les tests E2E fonctionnels
        run: npm run test:e2e:functional

      - name: Mesurer les Web Vitals en isolation
        run: npm run test:e2e:vitals

      - name: Publier la couverture Vitest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage
          if-no-files-found: ignore
          retention-days: 14

      - name: Publier le rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Publier le build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Déploiement Cloudflare
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
      VITE_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
      STATIC_SNAPSHOT_REQUIRED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier la source publique SEO
        run: |
          if [ -z "$PUBLIC_API_BASE_URL" ]; then
            echo "La variable GitHub PUBLIC_API_BASE_URL doit contenir l’URL HTTPS du backend public." >&2
            exit 1
          fi

      - name: Construire le site depuis le snapshot backend
        run: npm run build

      - name: Déployer sur Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm run cf:deploy

      - name: Ignorer le déploiement sans secrets
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "Déploiement ignoré : secrets Cloudflare non configurés."
