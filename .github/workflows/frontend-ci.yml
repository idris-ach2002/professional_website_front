name: Frontend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and hermetic E2E build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, worker policy, leak detection, unit tests, coverage and build
        run: npm run ci:quality

      - name: Upload hermetic E2E build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-dist
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage
          if-no-files-found: ignore
          retention-days: 14

  browser-contracts:
    name: Browser contracts (Chromium + Firefox)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_PREBUILT: "1"
      E2E_ARTIFACT_REQUIRE_PREBUILT: "1"
      PLAYWRIGHT_WORKER_CAP: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and Firefox
        run: npx playwright install --with-deps chromium firefox

      - name: Download hermetic E2E build
        uses: actions/download-artifact@v4
        with:
          name: frontend-e2e-dist
          path: dist

      - name: Run functional and stability browser contracts
        run: npm run ci:browser-contracts

      - name: Upload browser contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-contracts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  responsive:
    name: Responsive matrix
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PLAYWRIGHT_PREBUILT: "1"
      E2E_ARTIFACT_REQUIRE_PREBUILT: "1"
      PLAYWRIGHT_WORKER_CAP: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Download hermetic E2E build
        uses: actions/download-artifact@v4
        with:
          name: frontend-e2e-dist
          path: dist

      - name: Run responsive matrix
        run: npm run ci:responsive

      - name: Upload responsive report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-responsive-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  concurrency-contract:
    name: Hosted concurrency contract
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_PREBUILT: "1"
      E2E_ARTIFACT_REQUIRE_PREBUILT: "1"
      PLAYWRIGHT_WORKERS: "2"
      PLAYWRIGHT_STRESS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Download hermetic E2E build
        uses: actions/download-artifact@v4
        with:
          name: frontend-e2e-dist
          path: dist

      - name: Exercise hosted-runner race invariants
        run: npm run ci:concurrency:hosted

      - name: Upload concurrency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-concurrency-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  vitals:
    name: Web Vitals
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PLAYWRIGHT_PREBUILT: "1"
      E2E_ARTIFACT_REQUIRE_PREBUILT: "1"
      PLAYWRIGHT_WORKERS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Download hermetic E2E build
        uses: actions/download-artifact@v4
        with:
          name: frontend-e2e-dist
          path: dist

      - name: Run isolated Web Vitals
        run: npm run ci:vitals

      - name: Upload Web Vitals report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-vitals-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  main-thread:
    name: Main Thread Laboratory
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PLAYWRIGHT_PREBUILT: "1"
      E2E_ARTIFACT_REQUIRE_PREBUILT: "1"
      PLAYWRIGHT_WORKERS: "1"
      MAIN_THREAD_SAMPLE_MS: "1400"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Download hermetic E2E build
        uses: actions/download-artifact@v4
        with:
          name: frontend-e2e-dist
          path: dist

      - name: Run Main Thread Laboratory
        run: npm run ci:main-thread

      - name: Upload main-thread report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-main-thread-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  transparent-performance:
    name: Transparent performance contract
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PLAYWRIGHT_PREBUILT: "1"
      E2E_ARTIFACT_REQUIRE_PREBUILT: "1"
      PLAYWRIGHT_WORKERS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Download hermetic E2E build
        uses: actions/download-artifact@v4
        with:
          name: frontend-e2e-dist
          path: dist

      - name: Run transparent performance contract
        run: npm run ci:transparent-performance

      - name: Upload transparent performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-transparent-performance-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  verify:
    name: Frontend freeze gate
    needs: [browser-contracts, responsive, concurrency-contract, vitals, main-thread, transparent-performance]
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm all gates
        run: echo "Quality, browser, responsive, concurrency, Web Vitals, main-thread and transparent-performance contracts passed."

  soak:
    name: Runtime soak (manual diagnostic)
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PLAYWRIGHT_PREBUILT: "1"
      E2E_ARTIFACT_REQUIRE_PREBUILT: "1"
      PLAYWRIGHT_WORKERS: "1"
      SOAK_DURATION_MS: "60000"
      SOAK_HEARTBEAT_MS: "5000"
      SOAK_STRUCTURE_EVERY: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Download hermetic E2E build
        uses: actions/download-artifact@v4
        with:
          name: frontend-e2e-dist
          path: dist

      - name: Run soak
        run: npm run ci:soak

      - name: Upload soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-soak-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy Cloudflare
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    env:
      VITE_PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
      VITE_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
      STATIC_SNAPSHOT_REQUIRED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production build environment
        run: npm run check:production-env

      - name: Build deployable snapshot from public backend
        run: npm run build

      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm run cf:deploy

      - name: Skip deployment without secrets
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "Deployment skipped: Cloudflare secrets are not configured."
