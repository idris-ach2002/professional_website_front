<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123b52" stop-opacity=".18"/>
      <stop offset=".45" stop-color="#06263b" stop-opacity=".72"/>
      <stop offset="1" stop-color="#010713" stop-opacity=".98"/>
    </linearGradient>
    <linearGradient id="rockMain" x1=".2" y1=".08" x2=".78" y2=".95">
      <stop offset="0" stop-color="#244b61"/>
      <stop offset=".22" stop-color="#132f42"/>
      <stop offset=".58" stop-color="#071a2a"/>
      <stop offset="1" stop-color="#020812"/>
    </linearGradient>
    <linearGradient id="rockLit" x1=".1" y1=".05" x2=".9" y2="1">
      <stop offset="0" stop-color="#3a6273" stop-opacity=".86"/>
      <stop offset=".38" stop-color="#18384b" stop-opacity=".68"/>
      <stop offset="1" stop-color="#07131f" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="rockCold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#164c5d" stop-opacity=".52"/>
      <stop offset=".65" stop-color="#082739" stop-opacity=".32"/>
      <stop offset="1" stop-color="#03111d" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="lava" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2a6"/>
      <stop offset=".18" stop-color="#ffb229"/>
      <stop offset=".55" stop-color="#ff5b12"/>
      <stop offset="1" stop-color="#b91f0b"/>
    </linearGradient>
    <radialGradient id="crater" cx="50%" cy="45%" r="58%">
      <stop offset="0" stop-color="#fff8c6"/>
      <stop offset=".19" stop-color="#ffc53a"/>
      <stop offset=".48" stop-color="#ff5a12"/>
      <stop offset=".82" stop-color="#621409"/>
      <stop offset="1" stop-color="#120707"/>
    </radialGradient>
    <radialGradient id="hotRock" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff8a20" stop-opacity=".38"/>
      <stop offset=".5" stop-color="#f2460f" stop-opacity=".1"/>
      <stop offset="1" stop-color="#f2460f" stop-opacity="0"/>
    </radialGradient>
    <filter id="lavaGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- distant seabed relief: intentionally translucent so the website ocean remains the background -->
  <path d="M0 702C126 662 231 687 344 717c115 30 206 5 311-20 129-31 225-21 342 15 145 44 258 22 370-17 83-29 160-22 233 2v203H0Z" fill="url(#floor)"/>
  <path d="M0 750c116-72 220-77 323-25 71 36 144 36 229 8 112-37 211-31 306 8 108 44 210 44 317 2 141-56 276-51 425 8v149H0Z" fill="#020b18" opacity=".68"/>

  <!-- distant ridges -->
  <path d="M0 626c76-51 147-86 223-80 68 5 111 34 162 61 49 26 100 36 162 27-61 52-119 90-194 103-102 18-209-13-353 11Z" fill="#061927" opacity=".78"/>
  <path d="M1600 614c-82-41-166-70-247-61-62 7-111 39-158 65-51 28-105 38-167 30 58 48 120 79 194 91 104 16 216-18 378 10Z" fill="#061927" opacity=".8"/>

  <!-- far hydrothermal chimneys -->
  <g opacity=".56" fill="#082536">
    <path d="M245 695l12-108 16-19 9 23 2 105Z"/>
    <path d="M284 702l7-82 13-16 12 17 2 80Z"/>
    <path d="M1289 704l7-92 15-17 12 21 2 88Z"/>
    <path d="M1332 707l10-120 14-13 13 18 1 112Z"/>
  </g>

  <!-- main volcano silhouette -->
  <path d="M242 790c65-40 118-76 167-121 51-47 88-106 132-145 44-39 91-49 130-83 28-24 50-68 82-92 19-14 42-22 67-20 37 4 50 39 82 59 35 22 77 28 105 64 34 44 55 91 98 132 45 44 95 75 138 122 28 30 56 56 96 84Z" fill="url(#rockMain)"/>

  <!-- structural rock planes -->
  <path d="M309 761c83-69 128-133 191-172 48-30 88-42 126-87 32-38 50-88 93-111-34 74-25 122-79 178-45 46-81 102-108 170Z" fill="url(#rockLit)" opacity=".82"/>
  <path d="M718 388c-17 64-3 113-17 164-15 54-66 113-93 195l165 24c11-67 7-111 32-156 23-42 78-78 91-144-31-16-50-48-74-67-26-20-57-28-104-16Z" fill="#061420" opacity=".7"/>
  <path d="M854 413c22 54 12 104 45 148 37 48 92 72 143 146l198 67c-61-75-110-114-154-170-42-53-60-116-121-155-37-24-70-29-111-36Z" fill="url(#rockCold)" opacity=".88"/>
  <path d="M485 714c59-32 96-58 142-100 35-31 66-64 101-82-12 79-45 119-79 177-21 35-29 55-34 83Z" fill="#123247" opacity=".55"/>
  <path d="M995 678c-44-49-72-89-104-124-27-30-55-47-80-76 67 27 109 48 148 92 36 40 57 84 102 138Z" fill="#17394a" opacity=".42"/>
  <g fill="#102c3c" opacity=".72">
    <path d="M555 624l31-29 27 10 4 31-34 22-28-9Z"/>
    <path d="M641 507l22-25 30 4 11 28-27 24-31-7Z"/>
    <path d="M911 557l29-22 31 12 5 32-34 17-27-15Z"/>
    <path d="M1015 655l27-19 28 8 10 27-31 20-29-8Z"/>
    <path d="M692 701l28-17 30 10 3 27-28 18-32-12Z"/>
  </g>

  <!-- irregular crater: broken basalt rim instead of a geometric ellipse -->
  <path d="M711 363c18-21 37-36 59-43 18-6 31-3 46-7 22-6 45-1 61 12 13 10 22 26 28 42-25-13-50-18-76-17-23 1-40 7-62 8-20 1-37 0-56 5Z" fill="#04090f"/>
  <path d="M734 361c15-12 32-20 50-21 16-1 28 4 44 2 18-2 34 3 47 14-13 12-33 18-55 20-29 3-58-1-86-15Z" fill="url(#crater)" opacity=".98"/>
  <path d="M710 363c26-3 48-2 70 3 32 7 62 10 94-2 12-5 21-8 31-9-12 20-27 31-49 39-27 10-56 10-84 3-27-6-47-17-62-34Z" fill="#0b1721"/>
  <path d="M742 365c21 7 40 10 60 10 21 0 41-4 63-13-11 15-28 23-50 26-28 3-51-4-73-23Z" fill="#34150d" opacity=".78"/>

  <!-- subtle thermal aura embedded in the rock -->
  <ellipse cx="800" cy="452" rx="250" ry="210" fill="url(#hotRock)" opacity=".52"/>

  <!-- lava glow underlay -->
  <g fill="none" stroke="#ff4d0a" stroke-linecap="round" stroke-linejoin="round" opacity=".34" filter="url(#lavaGlow)">
    <path d="M803 374c-4 40 15 63 4 96-11 34-44 50-37 91 6 36 39 54 30 91-8 31-28 55-25 94" stroke-width="20"/>
    <path d="M782 460c-38 20-70 36-91 72-18 31-22 67-54 97" stroke-width="13"/>
    <path d="M817 464c37 17 67 43 79 79 12 35 2 66 39 102" stroke-width="14"/>
    <path d="M774 566c-43 4-67 29-95 49" stroke-width="10"/>
    <path d="M806 617c30 7 56 22 80 49" stroke-width="9"/>
  </g>

  <!-- lava cracks -->
  <g fill="none" stroke="url(#lava)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M803 373c-4 39 15 64 4 96-12 34-44 51-37 91 6 36 39 54 30 91-8 31-28 55-25 94" stroke-width="7"/>
    <path d="M783 459c-38 20-71 37-92 73-18 30-22 66-54 97" stroke-width="4.8"/>
    <path d="M816 463c38 18 68 44 80 79 12 35 2 66 39 103" stroke-width="5.2"/>
    <path d="M773 565c-42 5-67 29-94 50" stroke-width="3.8"/>
    <path d="M805 618c31 7 57 22 81 49" stroke-width="3.4"/>
    <path d="M738 527c-17 10-30 24-42 43" stroke-width="3"/>
    <path d="M861 529c17 11 31 26 43 47" stroke-width="3"/>
  </g>

  <!-- rock strata and fractures -->
  <g fill="none" stroke="#3d6373" stroke-opacity=".24" stroke-width="2.2" stroke-linecap="round">
    <path d="M420 687c74-37 119-82 166-133"/>
    <path d="M379 734c105-32 173-80 226-143"/>
    <path d="M975 594c48 48 95 86 159 116"/>
    <path d="M934 535c56 38 99 75 132 122"/>
    <path d="M665 436c-45 20-75 47-101 82"/>
    <path d="M905 467c38 13 70 37 96 67"/>
  </g>

  <!-- foreground basalt rocks -->
  <g fill="#020a14">
    <path d="M0 850c44-54 101-72 157-48 29 13 49 37 58 68v30H0Z"/>
    <path d="M128 900c21-74 76-117 142-104 58 12 86 52 98 104Z"/>
    <path d="M1220 900c8-71 62-116 126-111 66 5 107 50 123 111Z"/>
    <path d="M1406 900c14-60 58-91 107-85 42 5 70 31 87 67v18Z"/>
    <path d="M300 900c22-37 57-56 98-47 34 7 55 24 70 47Z"/>
    <path d="M1077 900c21-42 62-61 104-49 30 9 53 25 67 49Z"/>
  </g>
  <g fill="#0b2636" opacity=".78">
    <ellipse cx="157" cy="832" rx="58" ry="24"/>
    <ellipse cx="333" cy="842" rx="42" ry="18"/>
    <ellipse cx="1254" cy="837" rx="48" ry="20"/>
    <ellipse cx="1453" cy="849" rx="46" ry="20"/>
  </g>

  <!-- cold coral silhouettes, kept understated -->
  <g fill="none" stroke-linecap="round" opacity=".54">
    <path d="M206 815c-2-31 6-58 1-81m0 35-23-25m23 8 25-31" stroke="#0b7f7a" stroke-width="11"/>
    <path d="M1368 817c0-29-8-49-4-78m1 39 25-30m-25 13-25-25" stroke="#116d75" stroke-width="10"/>
    <path d="M1132 823c-3-23 2-42 1-61m0 24 20-22m-20 5-17-18" stroke="#275f82" stroke-width="8"/>
  </g>

  <!-- tiny lava reflection on seabed -->
  <ellipse cx="802" cy="807" rx="184" ry="35" fill="#ff5a13" opacity=".055" filter="url(#softGlow)"/>
</svg>
